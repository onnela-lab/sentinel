name: Sentinel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install graphviz
        run: sudo apt-get install -y graphviz
      - name: Install
        run: |
          uv sync --all-groups
          uv pip install -e .
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Test
        run: uv run pytest --cov=sentinel --cov-report=term-missing
